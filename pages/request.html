<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Help - AssistAbility</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../javascript/myjavascript.js"></script>
</head>

<body>

<nav>

    <div class="logo">
        <a href="../index.html"><span>AssistAbility</span></a>
    </div>

    <div class="menu">
        <a href="../index.html">Home</a>
        <a href="location.html">Locations</a>
        <a href="visual-aids.html">Visual aids</a>
        <a href="support-guide.html">How to Help</a>
        <a href="request.html">Request Help</a>
    </div>

</nav>

<header>
    <div>
        <h1>Request Assistance</h1>
        <p>We are here to support you. Fill in the form below and we will contact you as soon as possible.</p>
    </div>
</header>

<main>

<section class="request">

<div class="image">

<img src="../assets/images/Photos_ Athletes with their medals from the World Games.jfif" alt="Helping people">

</div>

<div class="form">

<h2>Request Form</h2>

<form>

<label>Full Name</label><br>
<input type="text" placeholder="Enter your full name"><br><br>

<label>Email Address</label><br>
<input type="email" placeholder="Enter your email"><br><br>

<label>Phone Number</label><br>
<input type="tel" placeholder="078XXXXXXX"><br><br>

<label>Location</label><br>
<input type="text" placeholder="District or Sector"><br><br>

<label>Type of Disability</label><br>

<select>

<option>Choose</option>
<option>Visual Impairment</option>
<option>Hearing Impairment</option>
<option>Physical Disability</option>
<option>Speech Disability</option>
<option>Other</option>

</select>

<br><br>

<label>Urgency</label><br>

<select>

<option>Low</option>
<option>Medium</option>
<option>High</option>

</select>

<br><br>

<label>Who needs help?</label><br><br>

<input type="radio" name="person">
Myself

<input type="radio" name="person">
Someone Else

<br><br>

<label>Your Request</label><br>

<textarea rows="6" placeholder="Describe how we can help you"></textarea>

<br><br>

<button type="submit">Submit Request</button>

</form>

</div>

</section>

</main>

<footer>

<p>
Building a more inclusive world.
</p>

</footer>

</body>
</html>
